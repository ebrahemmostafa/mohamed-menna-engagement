<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohammed &amp; Menna · Wishes</title>
  <meta name="description" content="Leave a blessing for Mohammed and Menna and read the wishes shared by their guests.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{--rose:#65778e;--rose-light:#aeb9c7;--cream:#efebe2;--parchment:#ddd7c8;--ink:#3f4c5f;--muted:#8591a1;--card:#f6f3ec}
    html{min-height:100%;background:var(--cream)}
    body{min-height:100vh;margin:0;color:var(--ink);font-family:'Cormorant Garamond',serif;background:linear-gradient(rgba(239,235,226,.88),rgba(239,235,226,.94)),url('assets/linen-texture.jpg') center/cover fixed}
    .page{width:min(100% - 32px,720px);margin:0 auto;padding:28px 0 64px}
    .back{display:inline-flex;align-items:center;gap:8px;color:var(--rose);font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-decoration:none;text-transform:uppercase}
    .back:hover{text-decoration:underline}
    header{text-align:center;padding:48px 12px 36px}
    .eyebrow{display:block;margin-bottom:10px;color:var(--rose);font-family:'Cinzel',serif;font-size:9px;letter-spacing:5px;text-transform:uppercase}
    h1{margin:0;font-family:'Great Vibes',cursive;font-size:clamp(58px,14vw,92px);font-weight:400;line-height:1;color:var(--ink)}
    .subtitle{max-width:480px;margin:18px auto 0;color:var(--muted);font-size:18px;font-style:italic;line-height:1.65}
    .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px auto 0}
    .orn-line{width:54px;height:1px;background:linear-gradient(to right,transparent,var(--rose-light))}
    .orn-line:last-child{transform:rotate(180deg)}
    .orn-dot{width:6px;height:6px;background:var(--rose-light);transform:rotate(45deg)}
    .panel{padding:clamp(22px,6vw,40px);border:1px solid rgba(101,119,142,.2);border-radius:18px;background:rgba(246,243,236,.84);box-shadow:0 16px 50px rgba(80,96,119,.1);backdrop-filter:blur(8px)}
    .status{min-height:22px;margin:12px 0 0;text-align:center;color:var(--rose);font-size:15px;font-style:italic}
    .feed-heading{margin:0 0 18px;text-align:center;font-family:'Cinzel',serif;font-size:12px;font-weight:400;letter-spacing:4px;text-transform:uppercase}
    .empty{padding:42px 24px;border:1.5px dashed rgba(101,119,142,.25);border-radius:14px;text-align:center;color:var(--muted);font-size:18px;font-style:italic;line-height:1.7}
    .feed{display:flex;flex-direction:column;gap:14px}
    .wish-card{position:relative;padding:21px 22px 18px;overflow:hidden;border:1px solid rgba(101,119,142,.14);border-radius:11px;background:var(--card);box-shadow:0 3px 14px rgba(80,96,119,.07)}
    .wish-card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(to bottom,var(--parchment),var(--rose-light))}
    .wish-text{display:block;margin:0 0 9px;color:#536174;font-size:17px;font-style:italic;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
    .wish-from{display:block;color:var(--rose);font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;text-transform:uppercase}
    @media (max-width:480px){.page{width:min(100% - 22px,720px);padding-top:20px}header{padding-top:38px}.panel{padding:22px 16px}}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="wishes.js"></script>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html" aria-label="Back to the invitation">&larr; Back to invitation</a>
    <header>
      <span class="eyebrow">Blessings &amp; Wishes</span>
      <h1>Wishes Book</h1>
      <p class="subtitle">All the kind words shared for Mohammed and Menna on their special day.</p>
      <div class="orn" aria-hidden="true"><span class="orn-line"></span><span class="orn-dot"></span><span class="orn-line"></span></div>
    </header>
    <section class="panel" aria-label="Wedding wishes">
      <h2 class="feed-heading">Messages from our guests</h2>
      <div class="empty" id="wishEmpty">Be the first to leave a wish for Mohammed &amp; Menna.</div>
      <div class="feed" id="wishFeed" aria-live="polite"></div>
      <p class="status" id="wishStatus" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
